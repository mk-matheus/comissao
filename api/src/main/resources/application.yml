spring:
  application:
    name: comissao-api
  profiles:
    default: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true
    throw-exception-if-no-handler-found: true

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

server:
  port: 8080
  shutdown: graceful

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info

app:
  timezone: ${APP_TIMEZONE:America/Recife}
  base-url: ${APP_BASE_URL:http://localhost:3000}
  cors-origins: ${CORS_ORIGINS:http://localhost:3000}
  jwt-secret: ${JWT_SECRET}
  code-pepper: ${CODE_PEPPER}
  google-client-id: ${GOOGLE_CLIENT_ID:}
