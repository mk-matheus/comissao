services:
  postgres:
    image: postgres:16
    container_name: comissao-db
    environment:
      POSTGRES_DB: comissao
      POSTGRES_USER: comissao
      POSTGRES_PASSWORD: comissao
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comissao -d comissao"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    container_name: comissao-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # interface web

volumes:
  pgdata: